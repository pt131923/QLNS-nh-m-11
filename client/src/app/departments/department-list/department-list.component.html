<div class="container-fluid">

  <!-- Back Button -->
  <div class="mb-3">
    <button class="btn btn-secondary" [routerLink]="['/dashboard']">
      <i class="bi bi-arrow-left-short me-1"></i>
      {{ 'common.backToDashboard' | translate }}
    </button>
  </div>

  <!-- Main Card -->
  <div class="card mb-4">
    <div class="card-body">

      <!-- Action Buttons -->
      <div class="d-flex flex-wrap gap-2 mb-3">
        <button class="btn btn-success" [routerLink]="['/department-add']">
          <i class="bi bi-plus-circle me-1"></i> {{ 'common.addNew' | translate }}
        </button>
        <button class="btn btn-primary" (click)="onEditRow()">
          <i class="bi bi-pencil-square me-1"></i> {{ 'common.edit' | translate }}
        </button>
        <button class="btn btn-danger" (click)="onDeleteRow()">
          <i class="bi bi-trash me-1"></i> {{ 'common.delete' | translate }}
        </button>
        <!-- Export Excel -->
        <button class="btn btn-success" (click)="onExportExcel()" [title]="'common.exportToExcel' | translate">
          <i class="bi bi-file-earmark-excel me-1"></i> {{ 'common.exportToExcel' | translate }}
        </button>

        <!-- Export PDF -->
        <button class="btn btn-danger text-white" (click)="onExportPDF()" [title]="'common.exportToPdf' | translate">
          <i class="bi bi-file-earmark-pdf me-1"></i> {{ 'common.exportToPdf' | translate }}
        </button>
        <button class="btn btn-info text-white" (click)="toggleStats()">
          <i class="bi bi-bar-chart-line me-1"></i>
          {{ showStats ? ('common.hideStats' | translate) : ('common.showStats' | translate) }}
        </button>
      </div>

      <!-- Search -->
      <div class="mb-3">
        <input type="text" class="form-control form-control-sm"
               [(ngModel)]="searchText"
               (keyup.enter)="onSearch()"
               [placeholder]="'department.searchPlaceholder' | translate">
      </div>

      <!-- Thống kê -->
      <div *ngIf="showStats && statsData" class="mb-4">
        <div class="row g-3">
          <div class="col-md-12">
            <div class="alert alert-primary d-flex align-items-center py-2">
              <i class="bi bi-building fs-5 me-2"></i>
              <strong>{{ 'department.totalDepartments' | translate }}: {{ statsData.total }}</strong>
            </div>
          </div>
          <div class="col-md-6">
            <div class="card h-100">
              <div class="card-header fw-semibold bg-primary text-white py-2">
                <i class="bi bi-people me-1"></i> {{ 'department.staffScale' | translate }}
              </div>
              <div class="card-body py-3">
                <p class="mb-1">{{ 'employee.totalEmployees' | translate }}: <strong>{{ statsData.totalEmployees }}</strong></p>
                <p class="mb-0">{{ 'department.staffRatio' | translate }}: <strong>{{ statsData.avgEmployeesPerDept }}</strong></p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- AG Grid -->
      <ag-grid-angular
        style="width: 100%; height: 450px;"
        class="ag-theme-alpine"
        [columnDefs]="columnDefs"
        [rowData]="rowData"
        [gridOptions]="gridOptions"
        [defaultColDef]="defaultColDef"
        [pagination]="pagination"
        [paginationPageSize]="paginationPageSize"
        [paginationPageSizeSelector]="paginationPageSizeSelector"
        (gridReady)="onGridReady($event)"
        (rowClicked)="onRowClicked($event)"
      ></ag-grid-angular>

    </div>
  </div>
</div>

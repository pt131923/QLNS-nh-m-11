<div class="login-container">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
    <h2>{{ 'login.title' }}</h2>

    <div class="form-group">
      <label for="username">{{ 'login.username'}}</label>
      <input
        type="text"
        id="username"
        formControlName="username"
        class="form-control"
        [class.invalid]="submitted && loginForm.controls['username'].invalid"
      />
      <div class="error" *ngIf="submitted && loginForm.controls['username'].invalid">
        {{ 'login.username_required'  }}
      </div>
    </div>

    <div class="form-group">
      <label for="password">{{ 'login.password'}}</label>
      <input
        type="password"
        id="password"
        formControlName="password"
        class="form-control"
        [class.invalid]="submitted && loginForm.controls['password'].invalid"
      />
      <div class="error" *ngIf="submitted && loginForm.controls['password'].invalid">
        {{ 'login.password_required'}}
      </div>
    </div>

    <div class="form-group">
      <label for="rememberMe">
        <input
          type="checkbox"
          id="rememberMe"
          formControlName="rememberMe"
        />
        {{ 'login.remember }}
      </label>
    </div>

    <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="success" *ngIf="successMessage">{{ successMessage }}</div>

    <button type="submit" class="btn btn-primary" [disabled]="loading">
      {{ loading ? ('common.loading') : ('dashboard.login') }}
    </button>

    <p class="login-hint">Demo: admin / admin123</p>
  </form>
</div>

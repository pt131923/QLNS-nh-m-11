<div class="container-fluid">

  <!-- Back Button -->
  <div class="mb-3">
    <button class="btn btn-secondary" [routerLink]="['/dashboard']">
      <i class="bi bi-arrow-left-short me-1"></i>
      Quay lại Dashboard
    </button>
  </div>

  <!-- Main Card -->
  <div class="card mb-4">
    <div class="card-body">

      <!-- Action Buttons -->
      <div class="d-flex flex-wrap gap-2 mb-3">
        <button class="btn btn-success" [routerLink]="['/contract-add']">
          <i class="bi bi-plus-circle me-1"></i> Thêm mới
        </button>
        <button class="btn btn-primary" (click)="onEditRow()">
          <i class="bi bi-pencil-square me-1"></i> Sửa
        </button>
        <button class="btn btn-danger" (click)="onDeleteRow()">
          <i class="bi bi-trash me-1"></i> Xóa
        </button>
        <button class="btn btn-success" (click)="onBtExport()">
          <i class="bi bi-file-earmark-excel me-1"></i> Xuất Excel
        </button>
        <button class="btn btn-danger text-white" (click)="onExportPDF()">
          <i class="bi bi-file-earmark-pdf me-1"></i> Xuất PDF
        </button>
        <button class="btn btn-info text-white" (click)="toggleStats()">
          <i class="bi bi-bar-chart-line me-1"></i>
          {{ showStats ? 'Ẩn thống kê' : 'Thống kê' }}
        </button>
      </div>

      <!-- Filter Panel -->
      <div class="card bg-light mb-3">
        <div class="card-body py-2">
          <div class="row g-2 align-items-end">
            <!-- Tìm theo tên -->
            <div class="col-md-3">
              <label class="form-label small mb-1 fw-semibold">Tìm theo tên</label>
              <input type="text" class="form-control form-control-sm"
                     [(ngModel)]="filter.employeeName"
                     (keyup.enter)="onSearch()"
                     placeholder="Nhập tên nhân viên...">
            </div>

            <!-- Loại hợp đồng -->
            <div class="col-md-2">
              <label class="form-label small mb-1 fw-semibold">Loại hợp đồng</label>
              <select class="form-select form-select-sm" [(ngModel)]="filter.contractType">
                <option [ngValue]="undefined">-- Tất cả --</option>
                <option *ngFor="let t of contractTypeOptions" [ngValue]="t">{{ t }}</option>
              </select>
            </div>

            <!-- Địa điểm làm việc -->
            <div class="col-md-2">
              <label class="form-label small mb-1 fw-semibold">Địa điểm</label>
              <select class="form-select form-select-sm" [(ngModel)]="filter.workLocation">
                <option [ngValue]="undefined">-- Tất cả --</option>
                <option *ngFor="let loc of workLocationOptions" [ngValue]="loc">{{ loc }}</option>
              </select>
            </div>

            <!-- Nút tìm kiếm & xóa lọc -->
            <div class="col-md-3">
              <label class="form-label small mb-1 fw-semibold">&nbsp;</label>
              <div class="d-flex gap-1">
                <button class="btn btn-primary btn-sm flex-fill" (click)="onSearch()">
                  <i class="bi bi-search"></i> Tìm kiếm
                </button>
                <button class="btn btn-outline-secondary btn-sm" (click)="onClearFilter()">
                  <i class="bi bi-x-lg"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Thống kê -->
      <div *ngIf="showStats && statsData" class="mb-4">
        <div class="row g-3">
          <div class="col-md-12">
            <div class="alert alert-primary d-flex align-items-center py-2">
              <i class="bi bi-file-text fs-5 me-2"></i>
              <strong>Tổng số hợp đồng: {{ statsData.total }}</strong>
            </div>
          </div>
          
          <!-- Theo Loại hợp đồng -->
          <div class="col-md-5">
            <div class="card h-100">
              <div class="card-header fw-semibold bg-primary text-white py-2">
                <i class="bi bi-file-earmark-text me-1"></i> Theo loại hợp đồng
              </div>
              <div class="card-body py-2">
                <div *ngFor="let item of statsData.byContractType" class="mb-2">
                  <div class="d-flex justify-content-between small mb-1">
                    <span>{{ item.typeName }}</span>
                    <span class="fw-semibold">{{ item.count }} ({{ getStatPercent(item.count) }}%)</span>
                  </div>
                  <div class="progress" style="height:8px">
                    <div class="progress-bar bg-primary" role="progressbar"
                         [style.width]="getStatPercent(item.count) + '%'"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Theo Địa điểm -->
          <div class="col-md-4">
            <div class="card h-100">
              <div class="card-header fw-semibold bg-success text-white py-2">
                <i class="bi bi-geo-alt me-1"></i> Theo địa điểm
              </div>
              <div class="card-body py-2">
                <div *ngFor="let item of statsData.byWorkLocation" class="mb-2">
                  <div class="d-flex justify-content-between small mb-1">
                    <span>{{ item.location }}</span>
                    <span class="fw-semibold">{{ item.count }} ({{ getStatPercent(item.count) }}%)</span>
                  </div>
                  <div class="progress" style="height:8px">
                    <div class="progress-bar bg-success" role="progressbar"
                         [style.width]="getStatPercent(item.count) + '%'"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- AG Grid -->
      <ag-grid-angular
        style="width: 100%; height: 500px;"
        class="ag-theme-alpine"
        [columnDefs]="columnDefs"
        [rowData]="rowData"
        [gridOptions]="gridOptions"
        [defaultColDef]="defaultColDef"
        [pagination]="pagination"
        [paginationPageSize]="paginationPageSize"
        [paginationPageSizeSelector]="paginationPageSizeSelector"
        (gridReady)="onGridReady($event)"
        (rowClicked)="onRowClicked($event)"
      ></ag-grid-angular>

    </div>
  </div>

  <!-- Move to Leave Button -->
  <div class="d-flex justify-content-end mt-3">
    <button class="btn btn-warning" (click)="moveToLeave()">
      <i class="bi bi-box-arrow-right me-1"></i> Move to Leave
    </button>
  </div>

</div>

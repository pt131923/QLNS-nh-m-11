<div class="container py-3" *ngIf="contract">
  <div class="mb-3">
    <button class="btn btn-secondary" [routerLink]="['/contracts']">
      <i class="bi bi-arrow-left-short me-1"></i> {{ 'common.backToContracts' | translate }}
    </button>
  </div>

  <div class="card shadow-sm col-md-10 mx-auto">
    <div class="card-header bg-primary text-white py-3">
      <h5 class="mb-0"><i class="bi bi-pencil-square me-2"></i>{{ 'contract.edit' | translate }}</h5>
    </div>
    <div class="card-body p-4">
      <form #editForm="ngForm" id="editForm" (ngSubmit)="UpdateContract()">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">{{ 'contract.contractName' | translate }} <span class="text-danger">*</span></label>
            <input type="text" class="form-control" [(ngModel)]="contract.ContractName" name="ContractName" required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">{{ 'contract.employeeName' | translate }} <span class="text-danger">*</span></label>
            <input type="text" class="form-control" [(ngModel)]="contract.EmployeeName" name="EmployeeName" required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">{{ 'contract.contractType' | translate }} <span class="text-danger">*</span></label>
            <select class="form-select" [(ngModel)]="contract.ContractType" name="ContractType" required>
              <option value="Chính thức">Chính thức (Xác định / Vô thời hạn)</option>
              <option value="Thử việc">Thử việc (2 tháng)</option>
              <option value="Thời vụ">Thời vụ</option>
              <option value="Hợp đồng dịch vụ">Hợp đồng dịch vụ / Cộng tác viên</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Trạng thái hợp đồng</label>
            <select class="form-select" [(ngModel)]="contract.Status" name="Status">
              <option value="Hiệu lực">Hiệu lực</option>
              <option value="Sắp hết hạn">Sắp hết hạn</option>
              <option value="Hết hạn">Hết hạn</option>
              <option value="Đã thanh lý">Đã thanh lý / Chấm dứt</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">{{ 'contract.startDate' | translate }} <span class="text-danger">*</span></label>
            <input type="date" class="form-control" [(ngModel)]="contract.StartDate" name="StartDate" required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">{{ 'contract.endDate' | translate }}</label>
            <input type="date" class="form-control" [(ngModel)]="contract.EndDate" name="EndDate">
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">{{ 'contract.basicSalary' | translate }} (VNĐ) <span class="text-danger">*</span></label>
            <input type="number" class="form-control" [(ngModel)]="contract.BasicSalary" name="BasicSalary" min="0" required>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">{{ 'contract.allowance' | translate }} (VNĐ)</label>
            <input type="number" class="form-control" [(ngModel)]="contract.Allowance" name="Allowance" min="0">
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold">Số ngày phép năm theo HĐ</label>
            <input type="number" class="form-control" [(ngModel)]="contract.AnnualLeaveDays" name="AnnualLeaveDays" min="0">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">{{ 'contract.contractTerm' | translate }}</label>
            <input type="text" class="form-control" [(ngModel)]="contract.ContractTerm" name="ContractTerm">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">{{ 'contract.workLocation' | translate }}</label>
            <input type="text" class="form-control" [(ngModel)]="contract.WorkLocation" name="WorkLocation">
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold">Chế độ nghỉ phép / quyền lợi</label>
            <input type="text" class="form-control" [(ngModel)]="contract.Leaveofabsence" name="Leaveofabsence">
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold">{{ 'contract.jobDescription' | translate }}</label>
            <textarea class="form-control" [(ngModel)]="contract.JobDescription" name="JobDescription" rows="3"></textarea>
          </div>
        </div>

        <div class="d-flex gap-2 justify-content-end mt-4">
          <button type="button" class="btn btn-outline-secondary px-4" (click)="Cancel()">
            {{ 'common.cancel' | translate }}
          </button>
          <button type="submit" class="btn btn-primary px-4" [disabled]="!editForm.valid">
            <i class="bi bi-check-circle me-1"></i> {{ 'common.saveChanges' | translate }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="container py-3">
  <div class="mb-3">
    <button class="btn btn-secondary" [routerLink]="['/contracts']">
      <i class="bi bi-arrow-left-short me-1"></i> {{ 'common.backToContracts' | translate }}
    </button>
  </div>

  <div class="card shadow-sm col-md-10 mx-auto">
    <div class="card-header bg-primary text-white py-3">
      <h5 class="mb-0"><i class="bi bi-file-earmark-plus me-2"></i>{{ 'contract.addNew' | translate }}</h5>
    </div>
    <div class="card-body p-4">
      <form #addForm="ngForm" id="addForm" (ngSubmit)="AddContract()">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">{{ 'contract.contractName' | translate }} <span class="text-danger">*</span></label>
            <input type="text" class="form-control" name="ContractName" ngModel required placeholder="HĐLĐ-2026/01...">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">{{ 'contract.employeeName' | translate }} <span class="text-danger">*</span></label>
            <input type="text" class="form-control" name="EmployeeName" ngModel required placeholder="Tên nhân viên...">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">{{ 'contract.contractType' | translate }} <span class="text-danger">*</span></label>
            <select class="form-select" name="ContractType" ngModel required>
              <option value="" disabled selected>-- Chọn loại hợp đồng --</option>
              <option value="Chính thức">Chính thức (Xác định / Vô thời hạn)</option>
              <option value="Thử việc">Thử việc (2 tháng)</option>
              <option value="Thời vụ">Thời vụ</option>
              <option value="Hợp đồng dịch vụ">Hợp đồng dịch vụ / Cộng tác viên</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">{{ 'contract.contractTerm' | translate }}</label>
            <input type="text" class="form-control" name="ContractTerm" ngModel placeholder="VD: 12 tháng, 36 tháng, Không xác định thời hạn">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">{{ 'contract.startDate' | translate }} <span class="text-danger">*</span></label>
            <input type="date" class="form-control" name="StartDate" ngModel required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">{{ 'contract.endDate' | translate }}</label>
            <input type="date" class="form-control" name="EndDate" ngModel>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">{{ 'contract.basicSalary' | translate }} (VNĐ) <span class="text-danger">*</span></label>
            <input type="number" class="form-control" name="BasicSalary" ngModel min="0" required placeholder="Lương cơ bản đóng bảo hiểm">
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">{{ 'contract.allowance' | translate }} (VNĐ)</label>
            <input type="number" class="form-control" name="Allowance" ngModel min="0" placeholder="Phụ cấp hàng tháng">
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold">Số ngày phép năm theo HĐ</label>
            <input type="number" class="form-control" name="AnnualLeaveDays" [ngModel]="12" min="0" placeholder="Mặc định: 12 ngày">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">{{ 'contract.workLocation' | translate }}</label>
            <input type="text" class="form-control" name="WorkLocation" ngModel placeholder="Hà Nội, TP.HCM, Remote...">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Chế độ nghỉ phép / quyền lợi</label>
            <input type="text" class="form-control" name="Leaveofabsence" ngModel placeholder="Theo quy định nhà nước & quy chế cty...">
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold">{{ 'contract.jobDescription' | translate }}</label>
            <textarea class="form-control" name="JobDescription" ngModel rows="3" placeholder="Mô tả tóm tắt công việc..."></textarea>
          </div>
        </div>

        <div class="d-flex gap-2 justify-content-end mt-4">
          <button type="button" class="btn btn-outline-secondary px-4" (click)="onCancel()">
            {{ 'common.cancel' | translate }}
          </button>
          <button type="submit" class="btn btn-success px-4" [disabled]="!addForm.valid">
            <i class="bi bi-check-circle me-1"></i> {{ 'common.saveChanges' | translate }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

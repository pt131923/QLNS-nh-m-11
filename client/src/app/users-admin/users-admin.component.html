<div class="container mt-4">
  <div class="mb-3">
    <button class="btn btn-secondary" [routerLink]="['/dashboard']">
      <i class="bi bi-arrow-left-short me-1"></i> Back to Dashboard
    </button>
  </div>

  <h2 class="mb-3">User Management</h2>

  <div class="card p-3 mb-4">
    <h5 class="mb-3">Create User</h5>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Username</label>
        <input class="form-control" [(ngModel)]="createForm.UserName" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" [(ngModel)]="createForm.Password" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Role</label>
        <select class="form-select" [(ngModel)]="createForm.Role">
          <option value="admin">admin</option>
          <option value="manager">manager</option>
          <option value="user">user</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Email</label>
        <input class="form-control" [(ngModel)]="createForm.Email" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Phone</label>
        <input class="form-control" [(ngModel)]="createForm.PhoneNumber" />
      </div>
      <div class="col-md-4">
        <label class="form-label">EmployeeId</label>
        <input class="form-control" type="number" [(ngModel)]="createForm.EmployeeId" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Address</label>
        <input class="form-control" [(ngModel)]="createForm.Address" />
      </div>
      <div class="col-md-2">
        <label class="form-label">Active</label>
        <select class="form-select" [(ngModel)]="createForm.IsActive">
          <option [ngValue]="true">Active</option>
          <option [ngValue]="false">Inactive</option>
        </select>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary" (click)="createUser()">Create</button>
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-4">
      <input class="form-control" [(ngModel)]="q" placeholder="Search username/email/phone" />
    </div>
    <div class="col-md-2">
      <button class="btn btn-primary w-100" (click)="search()">Search</button>
    </div>
  </div>

  <div *ngIf="isLoading">Loading...</div>

  <div class="table-responsive" *ngIf="!isLoading">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Email</th>
          <th>Role</th>
          <th>Active</th>
          <th>EmployeeId</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of users">
          <td>{{ u.UserId }}</td>
          <td>{{ u.UserName }}</td>
          <td>{{ u.Email }}</td>
          <td>
            <select class="form-select form-select-sm" [ngModel]="u.Role" (ngModelChange)="updateRole(u, $event)">
              <option value="admin">admin</option>
              <option value="manager">manager</option>
              <option value="user">user</option>
            </select>
          </td>
          <td>
            <select class="form-select form-select-sm" [ngModel]="u.IsActive" (ngModelChange)="updateActive(u, $event)">
              <option [ngValue]="true">Active</option>
              <option [ngValue]="false">Inactive</option>
            </select>
          </td>
          <td>
            <input class="form-control form-control-sm" [value]="u.EmployeeId" (change)="updateEmployeeLink(u, $any($event.target).value)" />
          </td>
          <td>
            <button class="btn btn-sm btn-danger" (click)="deleteUser(u)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="d-flex gap-2 mt-2">
    <button class="btn btn-outline-secondary" (click)="prevPage()">Prev</button>
    <button class="btn btn-outline-secondary" (click)="nextPage()">Next</button>
    <span class="align-self-center">Page {{ page }}</span>
  </div>
</div>
